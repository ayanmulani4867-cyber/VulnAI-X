version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnaix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./vulnai_x.db
      - SECRET_KEY=${SECRET_KEY:-ChangeMeInProductionWithRandomSecretHex64}
      - EMERGENCY_STOP=false
      - ALLOW_PRIVATE_LAB_TARGETS=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO}
    volumes:
      - backend-data:/app/data

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vulnaix-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker.worker"]
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./vulnai_x.db
      - SECRET_KEY=${SECRET_KEY:-ChangeMeInProductionWithRandomSecretHex64}
      - EMERGENCY_STOP=false
      - ALLOW_PRIVATE_LAB_TARGETS=false
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO}
    volumes:
      - backend-data:/app/data
    depends_on:
      - backend

volumes:
  backend-data:
